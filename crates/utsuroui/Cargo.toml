[package]
name = "utsuroui"
description = "Dirty-rect GUI for 240x240 SPI TFTs: no_std, no-alloc, embedded-graphics + Embassy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["embedded", "gui", "no-std", "display", "dirty-rect"]
categories = ["embedded", "no-std", "graphics"]

[features]
default = []
# Adapter for `lcd-async` panels (`BandSink` implementation, model helpers).
lcd = ["dep:lcd-async", "dep:embedded-hal"]
# Pipelined paint/transfer overlap (embassy-sync channels + embassy-futures join).
pipeline = ["dep:embassy-sync", "dep:embassy-futures"]
# Embassy `ui_task` frame scheduler (adds the time driver dependency).
embassy = ["pipeline", "dep:embassy-time"]
# Optional U8g2 font backend. Fonts carry their own licenses; the demo and the
# firmware use the embedded-graphics fonts only.
u8g2 = ["dep:u8g2-fonts"]
# Full-frame render helpers (render a whole screen once, then send it in bands).
full-fb = []

[dependencies]
embedded-graphics.workspace = true
embedded-hal = { workspace = true, optional = true }
lcd-async = { workspace = true, optional = true }
u8g2-fonts = { workspace = true, features = ["embedded_graphics_textstyle"], optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }

[dev-dependencies]
pollster.workspace = true
# Host tests that link `embassy-sync` need a critical-section implementation.
critical-section = { workspace = true, features = ["std"] }

[lints]
workspace = true
