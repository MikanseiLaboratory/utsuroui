# Local development convenience. The workspace CI passes `--target` explicitly,
# and build.rs supplies the linker arguments either way.
[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip rp2040"

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "info"
